[package]
name = "unused"
version = "0.4.0"
authors = ["Joshua Clayton <joshua.clayton@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cli = { path = "crates/cli/" }
codebase_files = { path = "crates/codebase_files/" }
mimalloc = { version = "*", default-features = false, optional = true }
read_ctags = { path = "crates/read_ctags/" }
serde_json = { workspace = true }
token_search = { path = "crates/token_search/" }

[dev-dependencies]
assert_cmd = "2.1"
assert_fs = "1.1"
predicates = "3.1"

[[bin]]
name = "read-ctags"
path = "src/bin/read_ctags.rs"

[[bin]]
name = "token-search"
path = "src/bin/token_search.rs"

[[bin]]
name = "tracked-files"
path = "src/bin/codebase_files.rs"

[[bin]]
name = "unused"
path = "src/bin/unused.rs"

[workspace]
members = ["crates/*"]

[workspace.dependencies]
indicatif = { version = "0.18", features = ["rayon"] }
itertools = "0.14"
nom = "7"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
totems = "0.2"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
